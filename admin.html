<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA Admin — CMS</title>
<style>
:root{
  --bg:#101013;--bg2:#17171b;--panel:#1d1d22;--panel2:#26262c;
  --tx:#f2f2f4;--tx2:#9d9da4;--tx3:#6a6a72;
  --blue:#3c82f6;--green:#34c759;--amber:#ff9f0a;--red:#ff453a;
  --brd:rgba(255,255,255,.07);
  --font-ar:"SF Arabic","Segoe UI",Tahoma,sans-serif;
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:rgba(60,130,246,.3)}
button{font-family:inherit}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(100% 100% at 50% 0%,#1a1a20,#0d0d10)}
.login-card{width:360px;background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:24px;padding:38px 34px;
  backdrop-filter:blur(30px);box-shadow:0 40px 100px rgba(0,0,0,.5)}
.login-card .logo{font-weight:700;letter-spacing:.3em;font-size:18px;text-align:center;margin-bottom:6px}
.login-card .logo b{color:var(--blue)}
.login-card .sub{font-size:12px;color:var(--tx3);text-align:center;margin-bottom:28px}
.login-card label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);display:block;margin:14px 0 7px}
.login-card input{width:100%;background:var(--panel);border:1px solid var(--brd);border-radius:12px;color:var(--tx);
  padding:12px 14px;font-size:14px;outline:none;transition:border .3s}
.login-card input:focus{border-color:var(--blue)}
.login-card .btn{width:100%;margin-top:24px;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;
  font-size:14px;font-weight:600;cursor:pointer;transition:.3s}
.login-card .btn:hover{filter:brightness(1.15)}
.login-card .hint{font-size:11px;color:var(--tx3);text-align:center;margin-top:16px}
.login-card .err{color:var(--red);font-size:12px;text-align:center;margin-top:12px;min-height:16px}

/* ---------- shell ---------- */
#app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
#app.in{display:grid}
aside{background:var(--bg2);border-right:1px solid var(--brd);padding:26px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .logo{font-weight:700;letter-spacing:.3em;font-size:15px;padding:0 12px;margin-bottom:4px}
aside .logo b{color:var(--blue)}
aside .role{font-size:10.5px;color:var(--tx3);padding:0 12px;margin-bottom:26px}
.mi{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:500;color:var(--tx2);
  cursor:pointer;transition:.25s;margin-bottom:2px}
.mi:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.mi.on{background:rgba(60,130,246,.14);color:var(--blue)}
.mi .ic{width:18px;text-align:center;font-size:14px}
aside .sep{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);padding:18px 12px 8px}
aside .logout{margin-top:20px;color:var(--red)}
.lang-btn{display:flex;align-items:center;gap:8px;margin:0 12px 14px;padding:9px 14px;border-radius:11px;
  font-size:12px;font-weight:600;color:var(--tx2);background:var(--panel2);border:1px solid var(--brd);cursor:pointer;transition:.3s;width:calc(100% - 24px)}
.lang-btn:hover{color:var(--blue);border-color:rgba(60,130,246,.5)}
html[lang=ar] body{font-family:var(--font-ar)}
html[lang=ar] input,html[lang=ar] select,html[lang=ar] textarea{font-family:var(--font-ar)}

main{padding:34px 40px;max-width:1180px}
.page{display:none}
.page.on{display:block;animation:pin .35s ease}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1.pt{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.ps{font-size:12.5px;color:var(--tx3);margin-bottom:28px}

/* cards & stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--brd);border-radius:18px;padding:20px 22px}
.stat .k{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.stat .v{font-size:27px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .d{font-size:11px;margin-top:4px}
.stat .d.up{color:var(--green)}.stat .d.dn{color:var(--amber)}
.panel{background:var(--panel);border:1px solid var(--brd);border-radius:18px;padding:24px;margin-bottom:20px}
.panel h3{font-size:14px;font-weight:650;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.panel h3 .badge{font-size:10px;font-weight:600;color:var(--blue);background:rgba(60,130,246,.14);padding:4px 10px;border-radius:100px}

/* activity */
.act{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--brd);font-size:12.5px;color:var(--tx2)}
.act:last-child{border:none}
.act .t{color:var(--tx3);flex:none;width:60px;font-variant-numeric:tabular-nums;font-size:11px;padding-top:1px}
.act b{color:var(--tx);font-weight:600}
.act .tag{margin-left:auto;font-size:10px;font-weight:600;padding:3px 9px;border-radius:100px;flex:none;height:fit-content}
.tag.blue{color:var(--blue);background:rgba(60,130,246,.14)}
.tag.green{color:var(--green);background:rgba(52,199,89,.14)}
.tag.amber{color:var(--amber);background:rgba(255,159,10,.14)}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.f label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);display:block;margin-bottom:7px}
.f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;background:var(--panel2);border:1px solid var(--brd);
  border-radius:11px;color:var(--tx);padding:11px 13px;font-size:13px;outline:none;transition:border .3s;font-family:inherit}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue)}
.f input[type=color]{width:46px;height:34px;border:none;background:none;cursor:pointer;padding:0}
.f input[type=range]{width:100%;accent-color:var(--blue)}
.f .rv{font-size:11px;color:var(--tx3);margin-top:4px;font-variant-numeric:tabular-nums}
.switch{position:relative;width:44px;height:26px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--brd);border-radius:100px;transition:.3s}
.switch i::after{content:"";position:absolute;left:3px;top:2.5px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.3s}
.switch input:checked + i{background:var(--blue);border-color:var(--blue)}
.switch input:checked + i::after{transform:translateX(17px)}
.frow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--brd)}
.frow:last-child{border:none}
.frow .fl{font-size:13px;font-weight:500}
.frow .fs{font-size:11px;color:var(--tx3);margin-top:2px}

.btn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:11px 22px;font-size:13px;font-weight:600;cursor:pointer;transition:.3s}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:var(--panel2);color:var(--tx2);border:1px solid var(--brd)}
.btn.ghost:hover{color:var(--tx)}
.btn.danger{background:rgba(255,69,58,.14);color:var(--red)}
.btn.sm{padding:7px 14px;font-size:11.5px;border-radius:9px}
.btnrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

/* sequence manager */
.dropzone{border:1.5px dashed rgba(255,255,255,.16);border-radius:16px;padding:34px;text-align:center;color:var(--tx3);
  font-size:13px;transition:.3s;cursor:pointer;margin-bottom:20px}
.dropzone.hover{border-color:var(--blue);color:var(--blue);background:rgba(60,130,246,.06)}
.dropzone b{color:var(--tx2)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;max-height:420px;overflow-y:auto;padding-right:6px}
.frame{position:relative;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--brd);cursor:grab;transition:.25s}
.frame:hover{border-color:var(--blue);transform:translateY(-2px)}
.frame img{width:100%;aspect-ratio:1408/768;object-fit:cover;display:block}
.frame .n{position:absolute;left:6px;top:6px;font-size:9px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;
  padding:2px 7px;border-radius:100px;backdrop-filter:blur(4px)}
.frame .q{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.frame .ops{position:absolute;inset:auto 0 0 0;display:flex;justify-content:center;gap:6px;padding:6px;
  background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:.25s}
.frame:hover .ops{opacity:1}
.frame .ops button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:7px;font-size:10px;padding:4px 8px;cursor:pointer;backdrop-filter:blur(6px)}
.frame .ops button:hover{background:var(--blue)}
.frame.dragging{opacity:.4}

/* stages table */
.stage-row{display:grid;grid-template-columns:34px 1fr 110px 130px 90px auto;gap:12px;align-items:center;
  padding:12px 14px;background:var(--panel2);border:1px solid var(--brd);border-radius:13px;margin-bottom:9px;font-size:13px}
.stage-row .drag{cursor:grab;color:var(--tx3);text-align:center}
.stage-row input[type=text]{background:transparent;border:none;color:var(--tx);font-size:13px;font-weight:600;outline:none;width:100%}
.stage-row .range{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.stage-row .sw-color{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx3)}

/* gallery manager */
.gal-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.gtab{font-size:11.5px;font-weight:600;padding:7px 15px;border-radius:100px;cursor:pointer;background:var(--panel2);
  border:1px solid var(--brd);color:var(--tx2);transition:.3s}
.gtab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gimg{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--brd)}
.gimg img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gimg .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:none;color:#fff;width:22px;height:22px;
  border-radius:50%;font-size:10px;cursor:pointer;opacity:0;transition:.25s}
.gimg:hover .del{opacity:1}
.gimg .del:hover{background:var(--red)}

/* toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);z-index:600;
  background:var(--panel);border:1px solid var(--brd);color:var(--tx);font-size:13px;font-weight:500;
  padding:13px 26px;border-radius:100px;box-shadow:0 20px 60px rgba(0,0,0,.5);transition:.4s;display:flex;gap:10px;align-items:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .ok{color:var(--green)}

/* analytics bars */
.abar{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:12px}
.abar .lb{width:110px;color:var(--tx2);flex:none}
.abar .tr{flex:1;height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}
.abar .tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),#7db2ff)}
.abar .v{width:44px;text-align:right;color:var(--tx3);font-variant-numeric:tabular-nums;flex:none;font-size:11px}

.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:6px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--blue)}

@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}aside .sep,aside .role{display:none}main{padding:22px}}

/* ================= NEW ADMIN CSS ================= */
.admin-proj-switcher {
  padding: 12px 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--brd);
}
.admin-proj-switcher label {
  font-size: 10px;
  font-weight: 700;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  display: block;
  margin-bottom: 8px;
}
.admin-proj-switcher select {
  width: 100%;
  background: var(--panel);
  color: var(--tx);
  border: 1px solid var(--brd);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.25s;
}
.admin-proj-switcher select:focus {
  border-color: var(--blue);
}
.proj-admin-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 18px;
  background: var(--panel2);
  border: 1px solid var(--brd);
  border-radius: 14px;
  margin-bottom: 12px;
  transition: all 0.25s;
}
.proj-admin-row:hover {
  border-color: rgba(60,130,246,0.3);
}
.proj-admin-row.active-edit {
  border-color: var(--blue);
  background: rgba(60,130,246,0.08);
}
.proj-admin-row .pa-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.proj-admin-row img {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  flex: none;
  background: #101013;
  border: 1px solid var(--brd);
}
.proj-admin-row .pa-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.proj-admin-row .pa-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--tx);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.proj-admin-row .pa-title .ar {
  font-family: var(--font-ar);
  font-size: 13px;
  color: var(--tx2);
  font-weight: 500;
}
.proj-admin-row .pa-meta {
  font-size: 12px;
  color: var(--tx3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.proj-admin-row .pa-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ba-edit-card {
  background: var(--panel);
  border: 1px solid var(--brd);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
}
.ba-edit-card h4 {
  font-size: 16px;
  font-weight: 750;
  color: var(--blue);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ba-edit-row {
  display: grid;
  grid-template-columns: 90px 1.2fr 1fr 1fr;
  gap: 14px;
  align-items: center;
  margin-bottom: 14px;
  padding: 14px;
  background: var(--panel2);
  border-radius: 14px;
  border: 1px solid var(--brd);
}
@media(max-width:950px){
  .ba-edit-row { grid-template-columns: 1fr; }
}
.ba-edit-row img {
  width: 80px;
  height: 54px;
  border-radius: 8px;
  object-fit: cover;
  background: #101013;
  border: 1px solid var(--brd);
}
.w-thumb-box {
  position: relative;
  width: 100px;
  height: 64px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--brd);
  background: #101013;
}
.w-thumb-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

</head>
<body>

<!-- ================== LOGIN ================== -->
<div id="login">
  <div class="login-card">
    <div class="logo">AU<b>R</b>A</div>
    <div class="sub">Admin Panel · لوحة التحكم وإدارة المحتوى</div>
    <label>Email · البريد الإلكتروني</label>
    <input type="text" id="lEmail" value="admin@aura.studio">
    <label>Password · كلمة المرور</label>
    <input type="password" id="lPass" placeholder="••••••••">
    <button class="btn" id="lBtn">Sign In · تسجيل الدخول</button>
    <div class="err" id="lErr"></div>
    <div class="hint">Demo: password is <b>aura2026</b> · role-based (admin / editor)</div>
  </div>
</div>

<!-- ================== APP ================== -->
<div id="app">
  <aside>
    <div class="logo">AU<b>R</b>A</div>
    <div class="role" id="roleTag">Signed in as Admin</div>
    <div class="admin-proj-switcher">
      <label>Editing Project · المشروع الحالي</label>
      <select id="adminActiveProjectSelect" onchange="switchAdminProject(this.value)">
      </select>
    </div>
    <button class="lang-btn" onclick="AURA_I18N.toggle()">🌐 <span class="langLbl">العربية</span></button>
    <div class="mi on" data-p="dash"><span class="ic">◧</span>Dashboard · الرئيسية</div>
    <div class="sep">Content · المحتوى</div>
    <div class="mi" data-p="projects"><span class="ic">▤</span>Projects · المشاريع</div>
    <div class="mi" data-p="widgets"><span class="ic">❐</span>Widgets · الويدجات</div>
    <div class="mi" data-p="beforeafter"><span class="ic">⟷</span>Before/After · قبل وبعد</div>
    <div class="mi" data-p="sequence"><span class="ic">◫</span>Sequence · تسلسل الصور</div>
    <div class="mi" data-p="stages"><span class="ic">≡</span>Stages · المراحل</div>
    <div class="mi" data-p="gallery"><span class="ic">▦</span>Galleries · المعارض</div>
    <div class="mi" data-p="interior"><span class="ic">⌂</span>Interior · الداخلي</div>
    <div class="mi" data-p="hotspots"><span class="ic">◎</span>Hotspots · محرر النقاط</div>
    <div class="mi" data-p="materials"><span class="ic">◨</span>Materials · المواد</div>
    <div class="sep">Configuration · الإعدادات</div>
    <div class="mi" data-p="scroll"><span class="ic">↕</span>Playback · سرعة الفيديو</div>
    <div class="mi" data-p="ui"><span class="ic">◐</span>UI · تخصيص الواجهة</div>
    <div class="mi" data-p="seo"><span class="ic">⌕</span>SEO</div>
    <div class="mi" data-p="analytics"><span class="ic">∿</span>Analytics · التحليلات</div>
    <div class="mi logout" id="logout"><span class="ic">⏻</span>Sign out · خروج</div>
  </aside>

  <main>

    <!-- ========== DASHBOARD ========== -->
    <div class="page on" id="p-dash">
      <h1 class="pt">Dashboard · الرئيسية</h1>
      <div class="ps">Overview · نظرة عامة على موقعك التفاعلي</div>
      <div class="stats">
        <div class="stat"><div class="k">Projects · المشاريع</div><div class="v">4</div><div class="d up">+1 this month</div></div>
        <div class="stat"><div class="k">Visitors · الزوار (30ي)</div><div class="v">18,402</div><div class="d up">+22.4%</div></div>
        <div class="stat"><div class="k">Frames · الإطارات</div><div class="v" id="dFrames">97</div><div class="d">WebP · 4.8 MB total</div></div>
        <div class="stat"><div class="k">Storage · التخزين</div><div class="v">1.2<span style="font-size:15px;color:var(--tx3)"> GB</span></div><div class="d dn">62% of plan</div></div>
        <div class="stat"><div class="k">Images · الصور</div><div class="v">483</div><div class="d up">+56 this week</div></div>
        <div class="stat"><div class="k">View Time · مدة المشاهدة</div><div class="v">3:42</div><div class="d up">+0:31</div></div>
      </div>
      <div class="grid2">
        <div class="panel"><h3><span>Recent Activity · النشاط الأخير</span> <span class="badge">LIVE</span></h3>
          <div class="act"><span class="t">14:22</span><div><b>Hero frame 097</b> replaced (night view re-render)</div><span class="tag blue">SEQUENCE</span></div>
          <div class="act"><span class="t">13:05</span><div><b>Villa Solara</b> — facade gallery +12 images</div><span class="tag green">GALLERY</span></div>
          <div class="act"><span class="t">11:48</span><div>Scroll smoothness changed 0.10 → 0.085</div><span class="tag amber">SETTINGS</span></div>
          <div class="act"><span class="t">10:31</span><div><b>Blueprint B-204 rev 13</b> uploaded (DWG)</div><span class="tag blue">BLUEPRINT</span></div>
          <div class="act"><span class="t">09:12</span><div>Editor <b>sara@aura.studio</b> signed in</div><span class="tag green">AUTH</span></div>
        </div>
        <div class="panel"><h3>Project Status · حالة المشاريع</h3>

function fmtT(s){const m=Math.floor(s/60),r=Math.round(s%60);return m?`${m}m ${r}s`:`${r}s`;}
function updPb(){
  const fe=+pFpsExt.value,fi=+pFpsInt.value,pe=+pPauseExt.value,pr=+pPauseRoom.value;
  pFpsExtV.textContent=`${fe} fps — ${fe<6?'بطيء وسينمائي':fe<12?'متوازن':'سريع'} · exterior takes ${fmtT(97/fe)}`;
  pFpsIntV.textContent=`${fi} fps — each room ≈ ${fmtT(31/fi)}`;
  pPauseExtV.textContent=`${pe}s hold on "Explore the Villa"`;
  pPauseRoomV.textContent=`${pr}s between rooms`;
  const extT=97/fe, intT=109/fi, pauseT=pe+pr*4;
  pbExtT.textContent=fmtT(extT);pbIntT.textContent=fmtT(intT);pbPauseT.textContent=fmtT(pauseT);
  document.getElementById('pbTotal').textContent='≈ '+fmtT(extT+intT+pauseT)+' full loop';
}
function pbPreset(fe,fi,pe,pr){
  pFpsExt.value=fe;pFpsInt.value=fi;pPauseExt.value=pe;pPauseRoom.value=pr;updPb();

  }).join('');
}

function switchAdminProject(id){
  CFG = AURA.setActiveProject(id);

}

function renderAdminProjectsList(){
  const wrap = document.getElementById('adminProjectsList');
  if(!wrap) return;
  const projs = CFG.projects || [];
  wrap.innerHTML = projs.map((p, idx) => {
    const isAct = p.id === CFG.activeProjectId;
    const coverSrc = p.cover || 'assets/villa.png';
    const tagColor = p.status === 'Completed' ? 'green' : p.status === 'In Progress' ? 'amber' : 'blue';
    return `<div class="proj-admin-row ${isAct ? 'active-edit' : ''}">
      <div class="pa-left">
        <img src="${coverSrc}" alt="${p.title}">
        <div class="pa-info">
          <div class="pa-title">${p.title} <span class="ar">${p.titleAr || ''}</span></div>
          <div class="pa-meta">
            <span>${p.location || 'Kuwait'}</span> · 
            <span>${p.area || ''}</span> · 
            <span class="tag ${tagColor}">${(p.status || 'PUBLISHED').toUpperCase()}</span>
            ${p.isDefault ? '<span class="tag blue">DEFAULT PROJECT</span>' : ''}
          </div>
        </div>
      </div>
      <div class="pa-actions">
        <button class="btn sm ghost" onclick="switchAdminProject('${p.id}'); go('projects');">✎ Edit Data</button>
        ${!p.isDefault ? `<button class="btn sm ghost" onclick="setDefaultProject('${p.id}')">★ Make Default</button>` : ''}
        <button class="btn sm ghost" onclick="moveProjectOrder('${p.id}', -1)" title="Move Left/Up in Top Bar">▲</button>
        <button class="btn sm ghost" onclick="moveProjectOrder('${p.id}', 1)" title="Move Right/Down in Top Bar">▼</button>
        <button class="btn sm danger" onclick="deleteProject('${p.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

function moveProjectOrder(id, direction){
  const projs = CFG.projects || [];
  const idx = projs.findIndex(p => p.id === id);
  if(idx < 0) return;
  const newIdx = idx + direction;
  if(newIdx < 0 || newIdx >= projs.length) return;
  const orderedIds = [...projs.map(p => p.id)];
  const tmp = orderedIds[idx];
  orderedIds[idx] = orderedIds[newIdx];
  orderedIds[newIdx] = tmp;
  AURA.reorderProjects(CFG, orderedIds);
  CFG = AURA.load();
  renderAdminProjectsList();
  toast('Projects reordered in Top Bar · تم تغيير ترتيب المشاريع');
}

function deleteProject(id){
  if(CFG.projects.length <= 1){
    toast('Cannot delete the last remaining project · لا يمكن حذف المشروع الوحيد المتبقي');
    return;
  }
  const p = AURA.getProjectById(CFG, id);
  if(confirm(`Delete project "${p ? p.title : id}"? This cannot be undone.`)){
    AURA.deleteProject(CFG, id);
    CFG = AURA.load();
    boot();
    toast('Project deleted · تم حذف المشروع');
  }
}

function setDefaultProject(id){
  AURA.setDefaultProject(CFG, id);
  CFG = AURA.load();
  boot();
  toast('Homepage default project updated · تم تحديد المشروع الرئيسي الافتراضي');
}

function createNewProject(){
  const title = prompt('Enter New Project Title (English) · اسم المشروع:', 'New Project');
  if(!title) return;
  const titleAr = prompt('Enter Project Title (Arabic) · الاسم بالعربية:', 'مشروع جديد') || 'مشروع جديد';
  const newProj = {
    id: 'proj_' + Math.random().toString(36).substr(2, 6),
    title: title,
    titleAr: titleAr,
    location: "Kuwait",
    locationAr: "الكويت",
    area: "650 m²",
    year: "2027",
    status: "In Progress",
    statusAr: "قيد الإنشاء",
    cover: "assets/villa.png",
    isDefault: false,
    project: { title: title, titleAr: titleAr, location: "Kuwait", locationAr: "الكويت", area: "650 m²", year: "2027", status: "In Progress", statusAr: "قيد الإنشاء", progress: 50 },
    progressData: { buildPct: 50, qualPct: 90, roomPhase: "Shell", integrity: "99.5%", loadPath: "Verified", deflection: "0.5 mm", foundation: "C40/50", travertine: "500 m²", costUsed: "50%", qaInspections: "12/24" },
    sequence: { path: "assets/seq/", prefix: "frame", digits: 3, ext: ".webp", count: 97 },
    stages: JSON.parse(JSON.stringify(AURA.DEFAULT_STAGES || [])),
    interior: JSON.parse(JSON.stringify(AURA.DEFAULT_INTERIOR || {})),
    widgets: JSON.parse(JSON.stringify(AURA.DEFAULT_WIDGETS || {})),
    beforeAfter: JSON.parse(JSON.stringify(AURA.DEFAULT_BEFORE_AFTER || []))
  };
  AURA.addProject(CFG, newProj);
  AURA.setActiveProject(newProj.id);
  CFG = AURA.load();
  boot();
  toast('New project created and selected for editing · تم إنشاء المشروع الجديد');
}

/* WIDGET EDITOR */
function renderWidgetsEditor(){
  const proj = AURA.getActiveProject(CFG);
  if(document.getElementById('wEditProjBadge')) {
    document.getElementById('wEditProjBadge').textContent = (proj.title || 'PROJECT') + ' WIDGETS';
  }
  loadSelectedWidgetIntoForm();
}

function loadSelectedWidgetIntoForm(){
  const sel = document.getElementById('wSelect');
  if(!sel) return;
  const widgetId = sel.value;
  const proj = AURA.getActiveProject(CFG);
  const widgets = proj.widgets || {};
  const defW = (window.AURA_DEFAULTS.widgets || {})[widgetId] || {};
  const w = widgets[widgetId] || defW;

  document.getElementById('wTitleEn').value = w.title || '';
  document.getElementById('wTitleAr').value = w.titleAr || '';
  document.getElementById('wDescEn').value = w.desc || '';
  document.getElementById('wDescAr').value = w.descAr || '';
  document.getElementById('wImages').value = (w.images || []).join(', ');
  document.getElementById('wWa').value = w.contact ? (w.contact.whatsapp || '') : '';
  document.getElementById('wEmail').value = w.contact ? (w.contact.email || '') : '';
  document.getElementById('wFormTitle').value = w.contact ? (w.contact.formTitle || '') : '';
  previewWidgetImages();
}

function previewWidgetImages(){
  const wrap = document.getElementById('wImagesPreview');
  const input = document.getElementById('wImages');
  if(!wrap || !input) return;
  const urls = input.value.split(',').map(u => u.trim()).filter(Boolean);
  wrap.innerHTML = urls.map(u => `<div class="w-thumb-box"><img src="${u}" alt=""></div>`).join('');
}

function saveWidgetEditor(){
  const sel = document.getElementById('wSelect');
  if(!sel) return;
  const widgetId = sel.value;
  const proj = AURA.getActiveProject(CFG);
  if(!proj.widgets) proj.widgets = {};

  const images = document.getElementById('wImages').value.split(',').map(u => u.trim()).filter(Boolean);
  proj.widgets[widgetId] = {
    title: document.getElementById('wTitleEn').value,
    titleAr: document.getElementById('wTitleAr').value,
    desc: document.getElementById('wDescEn').value,
    descAr: document.getElementById('wDescAr').value,
    images: images.length ? images : ['assets/villa.png'],
    contact: {
      whatsapp: document.getElementById('wWa').value,
      email: document.getElementById('wEmail').value,
      formTitle: document.getElementById('wFormTitle').value
    }
  };

  AURA.save(CFG);
  CFG = AURA.load();
  toast('Widget [' + widgetId + '] published · تم حفظ إعدادات الويدجت');
}

function resetWidgetToDefault(){
  const sel = document.getElementById('wSelect');
  if(!sel) return;
  const widgetId = sel.value;
  const proj = AURA.getActiveProject(CFG);
  const defW = (window.AURA_DEFAULTS.widgets || {})[widgetId];
  if(defW && proj.widgets) {
    proj.widgets[widgetId] = JSON.parse(JSON.stringify(defW));
    AURA.save(CFG);
    CFG = AURA.load();
    loadSelectedWidgetIntoForm();
    toast('Widget reset to default · تم استعادة الافتراضي');
  }
}

function saveBeforeAfterEditor(){
  const proj = AURA.getActiveProject(CFG);
  const baList = proj.beforeAfter || JSON.parse(JSON.stringify(window.AURA_DEFAULTS.beforeAfter || []));

  baList.forEach((item, idx) => {
    const bImg = document.getElementById(`baImgBefore_${idx}`);
    const aImg = document.getElementById(`baImgAfter_${idx}`);
    const bEn = document.getElementById(`baLblBeforeEn_${idx}`);
    const bAr = document.getElementById(`baLblBeforeAr_${idx}`);
    const aEn = document.getElementById(`baLblAfterEn_${idx}`);
    const aAr = document.getElementById(`baLblAfterAr_${idx}`);

    if(bImg) item.beforeImg = bImg.value;
    if(aImg) item.afterImg = aImg.value;
    if(bEn) item.beforeLabel = bEn.value;
    if(bAr) item.beforeLabelAr = bAr.value;
    if(aEn) item.afterLabel = aEn.value;
    if(aAr) item.afterLabelAr = aAr.value;
  });

  proj.beforeAfter = baList;
  AURA.save(CFG);
  CFG = AURA.load();
  toast('Before/After section published (8 images updated) · تم حفظ 8 صور لجميع البنود');
}

function resetBeforeAfterToDefault(){
  const proj = AURA.getActiveProject(CFG);
  proj.beforeAfter = JSON.parse(JSON.stringify(window.AURA_DEFAULTS.beforeAfter || []));
  AURA.save(CFG);
  CFG = AURA.load();
  renderBeforeAfterEditor();
  toast('Before/After section reset to defaults · تم استعادة الصور الافتراضية');
}

/* ---------------- frames grid (drag reorder) ---------------- */
function buildFrames(){
  const g=document.getElementById('framesGrid');g.innerHTML='';
  document.getElementById('seqCount').textContent=CFG.sequence.count;
  for(let n=1;n<=CFG.sequence.count;n++){
    const d=document.createElement('div');d.className='frame';d.draggable=true;d.dataset.n=n;
    d.innerHTML=`<img loading="lazy" src="assets/seq/thumbs/frame${String(n).padStart(3,'0')}.webp">
      <span class="n">${String(n).padStart(3,'0')}</span><span class="q" title="Quality check passed"></span>
      <div class="ops"><button onclick="toast('Frame ${n} — replace dialog (demo)')">Replace</button>
      <button onclick="toast('Frame ${n} duplicated')">Dup</button>
      <button onclick="toast('Frame ${n} deleted (demo)')">Del</button></div>`;
    d.addEventListener('dragstart',()=>d.classList.add('dragging'));
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');renumber();toast('Frames renumbered automatically')});
    d.addEventListener('dragover',e=>{
      e.preventDefault();
      const dr=g.querySelector('.dragging');if(!dr||dr===d)return;
      const r=d.getBoundingClientRect();
      g.insertBefore(dr,(e.clientX-r.left)/r.width>.5?d.nextSibling:d);
    });
    g.appendChild(d);
  }
}
function renumber(){[...document.querySelectorAll('#framesGrid .frame .n')].forEach((el,i)=>el.textContent=String(i+1).padStart(3,'0'))}

/* ---------------- stages editor ---------------- */
function buildStages(){
  const p=document.getElementById('stagesPanel');p.innerHTML='<h3>Stages — drag to reorder</h3>';
  CFG.stages.forEach((s,i)=>{
    const r=document.createElement('div');r.className='stage-row';r.draggable=true;
    r.innerHTML=`<span class="drag">⋮⋮</span>
      <input type="text" value="${s.name}" data-i="${i}" data-k="name">
      <span class="range">frames ${s.from}–${s.to}</span>
      <span class="sw-color"><input type="color" value="${s.color}" data-i="${i}" data-k="color" style="width:26px;height:26px;border:none;background:none;cursor:pointer">${s.icon}</span>
      <span class="range">${Math.round((s.to-s.from+1)/CFG.sequence.count*100)}%</span>
      <button class="btn sm ghost" onclick="toast('${s.name} gallery opened')">Gallery</button>`;
    r.addEventListener('dragstart',()=>r.classList.add('dragging'));
    r.addEventListener('dragend',()=>r.classList.remove('dragging'));
    r.addEventListener('dragover',e=>{e.preventDefault();
      const dr=p.querySelector('.dragging');if(!dr||dr===r)return;
      const rect=r.getBoundingClientRect();
      p.insertBefore(dr,(e.clientY-rect.top)/rect.height>.5?r.nextSibling:r);});
    p.appendChild(r);
  });
  p.addEventListener('input',e=>{
    const i=e.target.dataset.i,k=e.target.dataset.k;
    if(i!==undefined&&k)CFG.stages[i][k]=e.target.value;
  });
}
function saveStages(){AURA.save(CFG);toast('Stages published — timeline updated on site')}

/* ---------------- gallery manager ---------------- */
function buildGalleryTabs(){
  const tabs=document.getElementById('galTabs');tabs.innerHTML='';
  CFG.stages.forEach((s,i)=>{
    const t=document.createElement('div');t.className='gtab'+(i===0?' on':'');t.textContent=s.name;
    t.onclick=()=>{document.querySelectorAll('.gtab').forEach(x=>x.classList.remove('on'));t.classList.add('on');fillGal(s.id)};

      <button class="del" onclick="toast('Image removed from gallery (demo)')">✕</button>`;
    g.appendChild(d);

}

/* ---------------- heatmap ---------------- */
function buildHeat(){
  const h=document.getElementById('heat');h.innerHTML='';
  for(let i=0;i<96;i++){
    const stageEdge=[16,32,48,64,80,96].some(e=>Math.abs(i-e)<3);
    const v=stageEdge? .55+Math.random()*.45 : .08+Math.random()*.3;
    const el=document.createElement('i');el.style.opacity=v.toFixed(2);h.appendChild(el);
  }
}

/* ---------------- interior management ---------------- */
function buildInterior(){
  if(!CFG.interior)return;
  // theme tabs
  const tt=document.getElementById('themeTabs');tt.innerHTML='';
  CFG.interior.themes.forEach(th=>{
    const t=document.createElement('div');
    t.className='gtab'+(th===CFG.interior.theme?' on':'');
    t.textContent=th.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
    t.onclick=()=>{CFG.interior.theme=th;AURA.save(CFG);
      document.querySelectorAll('#themeTabs .gtab').forEach(x=>x.classList.remove('on'));
      t.classList.add('on');toast('Theme published: '+t.textContent);};
    tt.appendChild(t);
  });
  // room rows
  const rr=document.getElementById('roomRows');rr.innerHTML='';
  document.getElementById('roomCount').textContent=CFG.interior.rooms.length;
  CFG.interior.rooms.forEach((r,i)=>{
    const d=document.createElement('div');d.className='stage-row';
    d.style.gridTemplateColumns='34px 1fr 90px 110px 110px auto';
    d.innerHTML=`<span class="drag">⋮⋮</span>
      <input type="text" value="${r.name}" data-ri="${i}">
      <span class="range">${r.area}</span>
      <span class="range">${r.seq?r.seq+' frames':'no sequence'}</span>
      <span class="tag ${r.interactive?'green':'amber'}" style="justify-self:start">${r.interactive?'LIVE':'PENDING'}</span>
      <button class="btn sm ghost" onclick="toast('${r.name} — sequence upload (demo)')">Sequence</button>`;
    rr.appendChild(d);
  });
  rr.addEventListener('input',e=>{
    const i=e.target.dataset.ri;
    if(i!==undefined)CFG.interior.rooms[i].name=e.target.value;
  });
  // furniture rows
  const fr=document.getElementById('furnRows');fr.innerHTML='';
  Object.entries(CFG.interior.furniture).forEach(([room,items])=>{
    items.forEach(f=>{
      const d=document.createElement('div');d.className='act';
      d.innerHTML=`<span class="t">${room}</span><div><b>${f.name}</b> — ${f.brand} · ${f.material.split('·')[0]}</div>
        <span class="tag blue">${f.price||'—'}</span>`;
      fr.appendChild(d);
    });
  });
}
/* ---------------- hotspots editor ---------------- */
var HS_LAST={living:31,kitchen:31,master:31,bath:16};
var hsRoom='living', hsSel=-1, hsDrag=-1;

function hsInit(){
  if(!CFG.interior)return;
  hsRoom=hsRoom||'living';
  if(typeof HS_LAST==='undefined'||!HS_LAST)window.HS_LAST={living:31,kitchen:31,master:31,bath:16};
  const tabs=document.getElementById('hsTabs');tabs.innerHTML='';
  CFG.interior.rooms.filter(r=>r.interactive).forEach((r,i)=>{
    const t=document.createElement('div');
    t.className='gtab'+(r.id===hsRoom?' on':'');
    t.textContent=r.name+' · '+r.ar;
    t.onclick=()=>{hsRoom=r.id;hsSel=-1;hsInit();};
    tabs.appendChild(t);
  });
  document.getElementById('hsImg').src=
    `assets/rooms/seq/${hsRoom}/f${String(HS_LAST[hsRoom]).padStart(2,'0')}.webp`;
  hsRender();
}
function hsSpots(){CFG.interior.furniture[hsRoom]=CFG.interior.furniture[hsRoom]||[];return CFG.interior.furniture[hsRoom];}
function hsRender(){
  const st=document.getElementById('hsStage');
  st.querySelectorAll('.hsdot').forEach(e=>e.remove());
  const spots=hsSpots();
  document.getElementById('hsCount').textContent=spots.length;
  spots.forEach((f,i)=>{
    const d=document.createElement('div');d.className='hsdot';
    d.style.cssText=`position:absolute;left:${f.x}%;top:${f.y}%;width:26px;height:26px;margin:-13px;
      border-radius:50%;background:${i===hsSel?'var(--blue)':'rgba(255,255,255,.9)'};
      color:${i===hsSel?'#fff':'var(--blue)'};border:2px solid var(--blue);cursor:grab;
      display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:5;
      box-shadow:0 4px 14px rgba(0,0,0,.35)`;
    d.textContent=i+1;
    d.onpointerdown=e=>{e.stopPropagation();hsDrag=i;hsSel=i;hsFill();hsRender();};
    st.appendChild(d);
  });
  const list=document.getElementById('hsList');
  list.innerHTML=spots.length?'':'<div style="font-size:12px;color:var(--tx3)">No spots yet — click on the image · لا توجد نقاط، انقر على الصورة</div>';
  spots.forEach((f,i)=>{
    const row=document.createElement('div');row.className='act';row.style.cursor='pointer';
    row.innerHTML=`<span class="t">#${i+1}</span><div><b>${f.name||'(unnamed)'}</b>${f.nameAr?' · <span style="font-family:var(--font-ar)">'+f.nameAr+'</span>':''} — ${f.brand||'—'} · x:${Math.round(f.x)}% y:${Math.round(f.y)}%</div>
      <span class="tag blue">${f.price||'—'}</span>`;
    row.onclick=()=>{hsSel=i;hsFill();hsRender();};
    list.appendChild(row);
  });
}
function hsFill(){
  const f=hsSpots()[hsSel];if(!f){document.getElementById('hsForm').style.display='none';return;}
  document.getElementById('hsForm').style.display='block';
  document.getElementById('hsPos').textContent=`x: ${Math.round(f.x)}% · y: ${Math.round(f.y)}%`;
  hsName.value=f.name||'';hsNameAr.value=f.nameAr||'';
  hsMat.value=f.material||'';hsMatAr.value=f.materialAr||'';
  hsBrand.value=f.brand||'';hsColor.value=f.color||'';hsDims.value=f.dims||'';
  hsSup.value=f.supplier||'';hsPrice.value=f.price||'';hsFin.value=f.finish||'';
}
function hsApply(){
  const f=hsSpots()[hsSel];if(!f)return;
  Object.assign(f,{name:hsName.value,nameAr:hsNameAr.value,
    material:hsMat.value,materialAr:hsMatAr.value,
    brand:hsBrand.value,color:hsColor.value,dims:hsDims.value,
    supplier:hsSup.value,price:hsPrice.value,finish:hsFin.value});
  hsRender();toast('Spot updated · تم التعديل (Save & Publish لتظهر بالموقع)');
}
function hsDelete(){
  if(hsSel<0)return;
  hsSpots().splice(hsSel,1);hsSel=-1;hsFill();hsRender();
  toast('Spot deleted · تم حذف النقطة');
}
function hsSave(){AURA.save(CFG);toast('Hotspots published · تم النشر — الموقع يقرأها الآن');}
(function hsWire(){
  const st=document.getElementById('hsStage');
  st.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('hsdot'))return;
    const r=st.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
    hsSpots().push({x:+x.toFixed(1),y:+y.toFixed(1),name:'New Item',nameAr:'قطعة جديدة',material:'—',materialAr:'',brand:'—',
      color:'—',dims:'—',finish:'—',supplier:'—',price:'—'});
    hsSel=hsSpots().length-1;hsFill();hsRender();
    toast('Spot added · نقطة جديدة — عدّل بياناتها ثم Apply');
  });
  addEventListener('pointermove',e=>{
    if(hsDrag<0)return;
    const r=st.getBoundingClientRect();
    const f=hsSpots()[hsDrag];if(!f)return;
    f.x=+Math.min(98,Math.max(2,(e.clientX-r.left)/r.width*100)).toFixed(1);
    f.y=+Math.min(98,Math.max(2,(e.clientY-r.top)/r.height*100)).toFixed(1);
    document.getElementById('hsPos').textContent=`x: ${Math.round(f.x)}% · y: ${Math.round(f.y)}%`;
    hsRender();
  });
  addEventListener('pointerup',()=>hsDrag=-1);
})();

function saveInterior(){AURA.save(CFG);toast('Interior configuration published')}
